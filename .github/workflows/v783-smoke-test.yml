name: v783 smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "quick_test_v783.py"
      - "model.py"
      - "utils.py"
      - "Completeness_783.csv"
      - "Connectivity_783.parquet"
      - ".github/workflows/v783-smoke-test.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "brian2==2.5.1" pandas joblib pyarrow

      - name: Run v783 smoke test
        run: python quick_test_v783.py
